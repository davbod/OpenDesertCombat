name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on master always finish
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Godot release CI tests against. Upgrading Godot is a change to this line only.
  GODOT_VERSION: "4.4.1"

jobs:
  tests:
    name: Headless import + test suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$zip"
          unzip -o -q "$RUNNER_TEMP/$zip" -d ~/godot

      - name: Set up Godot
        run: |
          # The release zip holds a single executable named like the zip, minus ".zip"
          bin="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          if [ ! -f "$bin" ]; then
            echo "::error::Godot binary not found at $bin"
            ls -la ~/godot
            exit 1
          fi
          chmod +x "$bin"
          "$bin" --headless --version
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      # Import + every suite; a hung suite is killed after SUITE_TIMEOUT (default 180 s)
      - name: Run test suites
        run: godot/tests/run_all.sh
